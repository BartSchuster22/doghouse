service_id: hermes
display_name: Hermes Gateway
runtime:
  type: systemd
  unit: hermes.service
endpoints:
  live: http://127.0.0.1:8080/health
  ready: http://127.0.0.1:8080/health
  health: http://127.0.0.1:8080/health
  active_work: http://127.0.0.1:8080/watchdog/active-work
endpoint_modes:
  live: legacy_fallback
  ready: legacy_fallback
  health: native
  active_work: not_supported
policy:
  report_only: false
  restart_enabled: true
  kill_enabled: false
  failure_threshold: 3
  timeout_sec: 10
  startup_grace_sec: 90
  restart_settle_sec: 15
  active_task_guard: true
  active_task_query_failure_policy: defer
incidents:
  enabled: true
  dedupe_window_sec: 1800
