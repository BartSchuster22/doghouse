api:
  bind: 127.0.0.1
  port: 18793
  auth_mode: none-local-only

scheduler:
  service_interval_sec: 60
  devtask_interval_sec: 60
  audit_interval_sec: 300
  notification_interval_sec: 300
  shadow_interval_sec: 300
  incident_reconcile_interval_sec: 300
  openclaw_readiness_interval_sec: 300
  daily_evidence_interval_sec: 86400

paths:
  state_dir: /state
  incident_dir: /incidents
  log_dir: /logs
  checkpoint_dir: /checkpoints

safety:
  default_report_only: true
  default_restart_enabled: false
  default_kill_enabled: false
  dedupe_window_sec: 1800
