enabled: true
socket_path: /run/doghouse-executor.sock
restart_requires_service_policy: true
require_absolute_argv0: true
allowed_binaries:
  - /bin/systemctl
  - /usr/bin/systemctl
unit_name_regex: "^[A-Za-z0-9_.@\\-]+\\.service$"
audit_log_path: /srv/shared-memory/logs/watchdog-v2/executor-audit.jsonl
restart_cooldown_sec: 300
max_output_chars: 4000
allowed_services:
  hermes: hermes.service
  openclaw: openclaw.service
allowed_actions:
  systemctl_is_active:
    name: systemctl_is_active
    argv: [/bin/systemctl, is-active, "{unit}"]
    timeout_sec: 10
    destructive: false
    requires_execute_flag: false
  systemctl_show:
    name: systemctl_show
    argv: [/bin/systemctl, show, "{unit}", "--property=ActiveState,SubState,MainPID,NRestarts"]
    timeout_sec: 10
    destructive: false
    requires_execute_flag: false
  systemctl_restart:
    name: systemctl_restart
    argv: [/bin/systemctl, restart, "{unit}"]
    timeout_sec: 60
    destructive: true
    requires_execute_flag: true
